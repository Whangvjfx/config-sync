# -------------------------------------------------------------------
# Android TV / Chromecast 适配版 - Clash Meta (Mihomo)
# -------------------------------------------------------------------

# 基础设置
port: 7890
socks-port: 7891
mixed-port: 7892
allow-lan: true
mode: rule
log-level: info
ipv6: false # 保持关闭，有效防止校园网环境下的 IPv6 路由黑洞
external-controller: 127.0.0.1:9090
unified-delay: true
tcp-concurrent: true
keep-alive-interval: 15 # 保持长连接，防止安卓休眠断流

# -------------------------------------------------------------------
# TUN 模式 (Android 核心设置)
# -------------------------------------------------------------------
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - "any:53"
  auto-route: true
  auto-detect-interface: true
  strict-route: true # 严格路由，防止安卓系统层面部分流量绕过代理
  endpoint-independent-nat: true # 提升 UDP 穿透率，对 4K HDR 串流和 QUIC 协议更友好

# 流量探测
sniffer:
  enable: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
  force-domain:
    - +.v2ex.com

# -------------------------------------------------------------------
# DNS 优化 (适配 Android TV 与局域网投屏)
# -------------------------------------------------------------------
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  listen: 0.0.0.0:53
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - https://dns.google/dns-query
    - https://1.1.1.1/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
  # 关键：Fake-IP 过滤，确保电视时间同步、本地投屏和局域网发现不被代理接管
  fake-ip-filter:
    - '*.lan'
    - '*.localdomain'
    - '*.localhost'
    - '*.local'
    - '*.home.arpa'
    - time.*.com
    - time.*.gov
    - time.*.edu
    - time.windows.com
    - time.apple.com
    - ntp.*.com
    - pool.ntp.org

# -------------------------------------------------------------------
# 代理节点
# -------------------------------------------------------------------
