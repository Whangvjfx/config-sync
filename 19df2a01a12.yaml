# -------------------------------------------------------------------
# 代理组
# -------------------------------------------------------------------
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - 🎯 全局直连
      - "HEU-Cloudflare-Bobo"
      - "测试节点2-k523t2pu"

  - name: 📺 国际流媒体
    type: select
    proxies:
      - 🚀 节点选择
      - "HEU-Cloudflare-Bobo"
      - "测试节点2-k523t2pu"

  - name: 🤖 人工智能
    type: select
    proxies:
      - 🚀 节点选择
      - "HEU-Cloudflare-Bobo"
      - "测试节点2-k523t2pu"
      - 🎯 全局直连

  - name: ♻️ 自动选择
    type: url-test
    url: https://www.gstatic.com/generate_204 # 改用 gstatic，延迟测试更准
    interval: 300
    tolerance: 50
    proxies:
      - "HEU-Cloudflare-Bobo"
      - "测试节点2-k523t2pu"

  - name: 📱 国内直连 (B站/知乎)
    type: select
    proxies:
      - 🎯 全局直连
      - 🚀 节点选择

  - name: 🧱 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - 🎯 全局直连

  - name: 🎯 全局直连
    type: select
    proxies:
      - DIRECT

# -------------------------------------------------------------------
# 规则逻辑 (改用 GEOSITE 节省大量内存，防止 Chromecast 杀后台)
# -------------------------------------------------------------------
rules:
  # 局域网投屏、多播、组播直连 (Chromecast 投屏必备)
  - DOMAIN-SUFFIX,local,DIRECT
  - IP-CIDR,224.0.0.0/3,DIRECT,no-resolve
  - IP-CIDR,239.255.255.250/32,DIRECT,no-resolve
  - DST-PORT,8008,DIRECT # Chromecast 局域网控制端口
  - DST-PORT,8009,DIRECT
  - DST-PORT,8443,DIRECT # Cast TLS

  # 广告拦截
  - GEOSITE,category-ads-all,REJECT

  # AI 工具
  - GEOSITE,openai,🤖 人工智能
  - GEOSITE,anthropic,🤖 人工智能
  - GEOSITE,gemini,🤖 人工智能

  # 电视专属：流媒体 (YouTube, Netflix 等)
  - GEOSITE,youtube,📺 国际流媒体
  - GEOSITE,netflix,📺 国际流媒体
  - GEOSITE,disney,📺 国际流媒体

  # 国内常用社交/视频
  - GEOSITE,bilibili,📱 国内直连 (B站/知乎)
  - GEOSITE,zhihu,📱 国内直连 (B站/知乎)

  # 通用分类
  - GEOSITE,google,🚀 节点选择
  - GEOSITE,geolocation-!cn,🚀 节点选择

  # 地理位置分流
  - GEOIP,LAN,DIRECT,no-resolve
  - GEOIP,CN,DIRECT,no-resolve
  
  # 最终兜底
  - MATCH,🧱 漏网之鱼
