# ===================================================================
# 🚀 Clash Party / Mihomo (Clash Meta) Android 手机端纯血自建 VPS 稳定版配置
# 核心特性：
# 1. 【纯血 VPS 独享】仅包含您自建的 VPS 节点，绝无任何机场/公共订阅混入，干净纯粹
# 2. 【国内三网极速优选】集成直连 REALITY + Cloudflare 电信/联通/移动官方优选 IP 矩阵
# 3. 【零网络依赖】纯本地静态规则，彻底移除外部远程 Rule-Providers，杜绝首次导入卡死断网
# 4. 【Android 原生防感叹号】解决 Captive Portal 连通性检测与 DoH 死锁
# 5. 【双栈黑洞免疫】关闭 IPv6，规避 Android 4G/5G 蜂窝数据双栈丢包与泄露
# 更新时间：2026-10-03
# ===================================================================

# -------------------------------------------------------------------
# 1. 基础运行与性能设置 (Basic Settings)
# -------------------------------------------------------------------
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false                  # 关闭 IPv6，彻底解决 Android 4G/5G 蜂窝数据双栈黑洞
external-controller: 127.0.0.1:9090
unified-delay: true          # 启用统一延迟计算
tcp-concurrent: true         # 启用 Happy Eyeballs 并发连接
keep-alive-interval: 30
find-process-mode: off

# -------------------------------------------------------------------
# 2. TUN 虚拟网卡设置 (Android VpnService 原生适配)
# -------------------------------------------------------------------
tun:
  enable: true
  stack: mixed               # mixed / gvisor Android 端兼容性最佳
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-detect-interface: true

# -------------------------------------------------------------------
# 3. 流量嗅探 (Traffic Sniffer)
# -------------------------------------------------------------------
sniffer:
  enable: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true

# -------------------------------------------------------------------
# 4. DNS 深度优化 (解决 Android 连通性感叹号 & 杜绝 DoH 死锁)
# -------------------------------------------------------------------
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  listen: 0.0.0.0:53
  
  # 用于解析 DoH 自身的直连基础 DNS（彻底避免死锁）
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 180.184.1.1

  # 系统核心白名单（防止 Android 误报网络无连接/黄感叹号）
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost.ptlogin2.qq.com"
    - "+.srv.nintendo.net"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "msftconnecttest.com"
    - "msftncsi.com"
    - "connectivitycheck.gstatic.com"
    - "connectivitycheck.android.com"
    - "clients3.google.com"
    - "captive.apple.com"
    - "connectivity-check.ubuntu.com"
    - "detectportal.firefox.com"
    - "pool.ntp.org"
    - "*.pool.ntp.org"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.edu.cn"
    - "time.*.apple.com"
    - "time1.cloud.tencent.com"
    - "*.m.mi.com"
    - "*.battlenet.com.cn"
    - "localhost.sec.qq.com"
    - "+.push.apple.com"
    - "push.dbankcloud.com"
    - "*.push.hicloud.com"

  # 国内主流 DNS (解析国内域名)
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 180.184.1.1
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

  # 国外加密安全 DNS (防止 DNS 污染)
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
    - https://doh.opendns.com/dns-query

  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4

